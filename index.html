<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>D'Cruz Car Rental | Alto K10</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
    body {
      font-family: 'Inter', sans-serif;
      background-color: #090d16;
      overflow: hidden;
    }

    /* Background Flashing Ambient Lights with Color Change */
    @keyframes ambientShiftOne {
      0%, 100% {
        background-color: rgba(239, 68, 68, 0.28); /* Red */
        transform: translate(0, 0) scale(1);
        opacity: 0.45;
      }
      33% {
        background-color: rgba(245, 158, 11, 0.32); /* Amber */
        transform: translate(30px, -20px) scale(1.18);
        opacity: 0.85;
      }
      66% {
        background-color: rgba(16, 185, 129, 0.28); /* Emerald Green */
        transform: translate(-20px, 25px) scale(1.05);
        opacity: 0.5;
      }
    }

    @keyframes ambientShiftTwo {
      0%, 100% {
        background-color: rgba(59, 130, 246, 0.26); /* Police/Headlight Blue */
        transform: translate(0, 0) scale(1.1);
        opacity: 0.8;
      }
      33% {
        background-color: rgba(16, 185, 129, 0.30); /* Emerald Green */
        transform: translate(-35px, -15px) scale(0.95);
        opacity: 0.4;
      }
      66% {
        background-color: rgba(245, 158, 11, 0.32); /* Amber */
        transform: translate(25px, 30px) scale(1.2);
        opacity: 0.85;
      }
    }

    @keyframes strobePulse {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 0.65; }
    }

    .bg-orb-1 {
      animation: ambientShiftOne 6s infinite ease-in-out;
    }
    .bg-orb-2 {
      animation: ambientShiftTwo 7s infinite ease-in-out;
    }
    .bg-strobe-overlay {
      animation: strobePulse 2.2s infinite ease-in-out;
    }

    /* Traffic Light Blinking Animations */
    @keyframes blinkRed {
      0%, 30% { opacity: 1; box-shadow: 0 0 18px #ef4444, 0 0 36px rgba(239, 68, 68, 0.7); }
      35%, 100% { opacity: 0.2; box-shadow: none; }
    }
    @keyframes blinkAmber {
      0%, 33% { opacity: 0.2; box-shadow: none; }
      38%, 63% { opacity: 1; box-shadow: 0 0 18px #f59e0b, 0 0 36px rgba(245, 158, 11, 0.7); }
      68%, 100% { opacity: 0.2; box-shadow: none; }
    }
    @keyframes blinkGreen {
      0%, 66% { opacity: 0.2; box-shadow: none; }
      71%, 96% { opacity: 1; box-shadow: 0 0 18px #10b981, 0 0 36px rgba(16, 185, 129, 0.7); }
      100% { opacity: 0.2; box-shadow: none; }
    }

    .light-red { animation: blinkRed 4.5s infinite; }
    .light-amber { animation: blinkAmber 4.5s infinite; }
    .light-green { animation: blinkGreen 4.5s infinite; }

    /* Subtle Road Lane Dash Animation */
    @keyframes roadMove {
      0% { background-position: 0 0; }
      100% { background-position: -80px 0; }
    }
    .road-dashes {
      background-image: linear-gradient(90deg, #f59e0b 50%, transparent 50%);
      background-size: 40px 3px;
      background-repeat: repeat-x;
      animation: roadMove 1.4s linear infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-6 text-slate-100 select-none relative">

  <!-- Background Flashing & Color-Changing Lights -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-24 -left-24 w-96 h-96 rounded-full blur-3xl bg-orb-1"></div>
    <div class="absolute -bottom-24 -right-24 w-96 h-96 rounded-full blur-3xl bg-orb-2"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[32rem] h-[32rem] rounded-full blur-3xl bg-amber-500/10 bg-strobe-overlay"></div>
  </div>

  <!-- Main Centerpiece Card -->
  <div class="relative z-10 w-full max-w-md bg-slate-900/85 backdrop-blur-xl border border-slate-800/90 rounded-3xl p-8 shadow-2xl flex flex-col items-center text-center space-y-6">

    <!-- Blinking Traffic Signal Housing -->
    <div class="bg-slate-950 border-2 border-slate-800 px-5 py-3 rounded-full flex items-center gap-4 shadow-inner">
      <span class="w-4 h-4 rounded-full bg-red-500 light-red"></span>
      <span class="w-4 h-4 rounded-full bg-amber-400 light-amber"></span>
      <span class="w-4 h-4 rounded-full bg-emerald-500 light-green"></span>
    </div>

    <!-- Brand & Vehicle Info -->
    <div class="space-y-1.5">
      <h1 class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white">
        D'Cruz <span class="text-amber-400">Car Rental</span>
      </h1>
      <p class="text-xs font-medium uppercase tracking-widest text-slate-400">
        Alto K10 Hatchback • Agartala
      </p>
    </div>

    <!-- Animated Road Divider -->
    <div class="w-full h-1 road-dashes opacity-70 rounded"></div>

    <!-- Primary Booking Link -->
    <div class="pt-1">
      <a href="index3.html" 
         class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-400 text-slate-950 font-extrabold text-sm px-5 py-3 rounded-xl shadow-md transition">
        Taxi Alto Now
      </a>
    </div>

  </div>

</body>
</html>
